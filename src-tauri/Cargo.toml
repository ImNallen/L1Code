[package]
name = "l1code"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "l1code_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2"
ignore = "0.4"
notify = "8"
notify-debouncer-full = "0.7"
portable-pty = "0.9"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
trash = "5"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unreachable_pub = "warn"
